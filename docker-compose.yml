# ==============================================================================
# Orquestación con Docker Compose (IE4 & IE5 - DOY0101)
# ==============================================================================
services:
  product-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: product-inventory-microservice:latest
    ports:
      - "8000-8001:8000"
    environment:
      - APP_NAME=Microservicio de Inventario de Productos
      - APP_ENV=production
      - APP_VERSION=1.0.0
      - PORT=8000
      - HOST=0.0.0.0
    restart: unless-stopped
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
        reservations:
          cpus: "0.20"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - devops-network

networks:
  devops-network:
    driver: bridge
